<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d1117">
  <title>Frostwerk – Der Instandhalter</title>
  <meta name="description" content="Ein Instandhalter-Abenteuer in der Eisfabrik – präsentiert von Grollmus.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>

    <div id="hud">
      <div class="brand">FROSTWERK<small>Eisfabrik · Linie 1</small></div>
      <div class="stat"><label>Budget</label><b id="h-money">–</b></div>
      <div class="stat"><label>Eis produziert</label><b id="h-prod">–</b></div>
      <div class="stat"><label>Verfügbarkeit</label><b id="h-avail">–</b></div>
      <div class="stat"><label>Schichtzeit</label><b id="h-time">–</b></div>
      <div class="stat"><label>Rang</label><b id="h-rank">–</b></div>
      <div class="stat" title="Offener Budgetvorschuss der Werkleitung"><label>Vorschuss</label><b id="h-adv">–</b></div>
      <div class="sponsor">Sponsored by <span class="glogo">GROLLMUS</span></div>
    </div>

    <div id="skills"></div>
  </div>

  <!-- Touch-Steuerung (nur auf Touch-Geräten sichtbar) -->
  <div id="touch">
    <div id="joy"><div id="joy-knob"></div></div>
    <button id="t-pause" aria-label="Pause">❚❚</button>
    <button id="t-act" aria-label="Interagieren">✋</button>
  </div>

  <!-- Dialoge & Bildschirme: eigene Ebene, damit sie auf kleinen Displays lesbar bleiben -->
  <div id="ui"><div id="uiz">
    <div id="toasts"></div>
    <div id="modal" class="hidden"></div>
    <div id="screen"></div>
  </div></div>

  <div id="rotate"><div><div class="ri">📱</div>Bitte das Gerät quer halten</div></div>
  <script src="game.js"></script>
</body>
</html>
